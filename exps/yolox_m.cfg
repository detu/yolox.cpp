# C++ counterpart of the exps/yolox_m.py file from the guide.
# Format: key = value  (tuples as "640, 640"; anything after # is ignored)

#
# DONT CHANGE THIS
#
model = yolox-m          # sets depth = 0.67, width = 0.75

#
# FROM HERE YOU CAN CHANGE
#
exp_name = yolox_m
data_dir = datasets/COCO
train_ann = instances_train2017.json
val_ann = instances_val2017.json

num_classes = 6

max_epoch = 50
data_num_workers = 4
eval_interval = 1

# Everything else keeps the yolox_base.py defaults, e.g.:
# input_size = 640, 640
# test_size = 640, 640
# multiscale_range = 5
# mosaic_prob = 1.0
# mixup_prob = 1.0
# no_aug_epochs = 15
# warmup_epochs = 5
# basic_lr_per_img = 0.01 / 64.0
# test_conf = 0.01
# nmsthre = 0.65
